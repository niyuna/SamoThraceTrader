# HFT BB Reversal Strategy Configuration
# 动态参数配置文件

strategy_name: "HFTBBReversalStrategy"
version: "1.0.0"
environment: "production"
is_valid: true
# last_updated: "2024-01-15T10:00:00"

metadata:
  description: "HFT BB Reversal策略动态参数配置"
  author: "Strategy Team"
  # created_at: "2024-01-15T10:00:00"
  # updated_at: "2024-01-15T10:00:00"

# 策略参数配置
params:
  # 价格限制参数（动态可调整）
  price_limit_morning: 600    # 早上时段价格上限
  price_limit_noon: 600       # 中午时段价格上限  
  price_limit_afternoon: 6000  # 下午时段价格上限
  
  # 订单取消保护参数
  cancel_protection_seconds: 20  # 订单发送后多少秒内不允许取消

  # single_stock_max_position: 800000  # don't use this right now because we are not handling size change when there is already a position, so very likely there will be issue after the update
  
  # 个股交易配置
  # enable_individual_stock_trading: true  # 是否启用个股自定义交易配置
  # enable_default_stock_trading: true     # 是否启用默认股票交易配置，默认True
  
  # 时间窗口允许方向配置
  morning_allowed_directions: ['long', 'short']    # 早上窗口允许方向
  noon_allowed_directions: ['long', 'short']       # 中午窗口允许方向
  afternoon_allowed_directions: ['long', 'short']  # 下午窗口允许方向

  black_list:
    - "6098"
    - "6501,2914,6702,4502,4661,6752,9020,6723,4307,6971,9766,4503,9503,4091,4062,9532,8421,6504,9202,9201,4151,4204,9501,9042,3064,2768,4528,3231,9064,2327,9506,2002,4812,6141,7419,7984,7732,4205,6508,5471,9507,9003,1949,2127,9744,6754,6995,5191,4373,7817,7148,6807,2317,9505,8609,7283,9037,7976,2326,6080,8014,7241,6345,6023,8793,2220,5992,6196,5449,3636,4549,9889,4552,7433,9536,9552,4212,4221,8613,2540,4417,4461,5461,6419,2737,7508,8864,8706,7949,8708,9539,8614,9795,9368,4345,3580,6823,8622,8699,9640,4462,9709,4826,8624,5909,7823,3891,3648,7185,165A"
    - {"operation": "remove", "symbol": "165A"}

  # 其他策略参数（可选动态调整）
  # bb_entry_std_multiplier: 3.0    # BB入场标准差倍数
  # bb_exit_std_multiplier: -1.0    # BB出场标准差倍数
  # trigger_tick_count: 3           # 触发价格调整的tick数量

# 参数说明
parameter_descriptions:
  price_limit_morning: "早上交易时段（9:05-9:41）的股价上限，超过此价格的股票不允许交易"
  price_limit_noon: "中午交易时段（11:25-11:31）的股价上限，超过此价格的股票不允许交易"
  price_limit_afternoon: "下午交易时段（14:10-15:25）的股价上限，超过此价格的股票不允许交易"
  cancel_protection_seconds: "订单发送后多少秒内不允许取消，用于避免频繁撤单"
  enable_individual_stock_trading: "是否启用个股自定义交易配置，当为false时所有股票使用默认X条件检查"
  enable_default_stock_trading: "是否启用默认股票交易配置，当为false时默认X条件检查直接返回空列表"
  morning_allowed_directions: "早上交易窗口允许的交易方向，可选值：['long'], ['short'], ['long', 'short']"
  noon_allowed_directions: "中午交易窗口允许的交易方向，可选值：['long'], ['short'], ['long', 'short']"
  afternoon_allowed_directions: "下午交易窗口允许的交易方向，可选值：['long'], ['short'], ['long', 'short']"
  bb_entry_std_multiplier: "布林带入场标准差倍数，用于计算入场价格"
  bb_exit_std_multiplier: "布林带出场标准差倍数，用于计算出场价格"
  trigger_tick_count: "触发价格调整所需的tick数量"

# 参数验证规则
validation_rules:
  price_limit_morning:
    type: "number"
    min: 100
    max: 10000
    description: "早上价格限制必须在100-10000之间"
  price_limit_noon:
    type: "number"
    min: 100
    max: 10000
    description: "中午价格限制必须在100-10000之间"
  price_limit_afternoon:
    type: "number"
    min: 100
    max: 10000
    description: "下午价格限制必须在100-10000之间"
  bb_entry_std_multiplier:
    type: "number"
    min: 1.0
    max: 10.0
    description: "BB入场标准差倍数必须在1.0-10.0之间"
  bb_exit_std_multiplier:
    type: "number"
    min: -10.0
    max: 0.0
    description: "BB出场标准差倍数必须在-10.0-0.0之间"
  trigger_tick_count:
    type: "integer"
    min: 1
    max: 10
    description: "触发tick数量必须在1-10之间"
  cancel_protection_seconds:
    type: "integer"
    min: 10
    max: 300
    description: "取消保护时间必须在10-300秒之间"
  enable_individual_stock_trading:
    type: "boolean"
    description: "个股交易配置开关，必须为true或false"
  enable_default_stock_trading:
    type: "boolean"
    description: "默认股票交易配置开关，必须为true或false"
  morning_allowed_directions:
    type: "array"
    items:
      type: "string"
      enum: ["long", "short"]
    minItems: 1
    maxItems: 2
    description: "早上窗口方向必须是包含'long'和/或'short'的数组"
  noon_allowed_directions:
    type: "array"
    items:
      type: "string"
      enum: ["long", "short"]
    minItems: 1
    maxItems: 2
    description: "中午窗口方向必须是包含'long'和/或'short'的数组"
  afternoon_allowed_directions:
    type: "array"
    items:
      type: "string"
      enum: ["long", "short"]
    minItems: 1
    maxItems: 2
    description: "下午窗口方向必须是包含'long'和/或'short'的数组"
